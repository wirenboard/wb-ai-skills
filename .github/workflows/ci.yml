name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clone wirenboard/codestyle (sibling)
        run: git clone --depth 1 https://github.com/wirenboard/codestyle.git ../codestyle

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Regenerate plugin registry
        run: make registry

      - name: Lint (black + isort + pylint 10.00)
        run: make lint

      - name: Tests
        run: make test

  build-deb:
    name: build .deb
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b -d

      - name: Stage artifacts
        run: |
          mkdir -p dist
          mv ../wb-cli_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wb-cli-deb
          path: dist/wb-cli_*.deb
          if-no-files-found: error
          retention-days: 30
